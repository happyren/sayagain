name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  DCO:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          # Merge commits (e.g. "update branch" from GitHub) carry no sign-off and are not contributions.
          for sha in $(git rev-list --no-merges "$base..$head"); do
            # Bots do not certify the DCO; their bumps are reviewed like any other change.
            if git show -s --format=%an "$sha" | grep -qE '\[bot\]$'; then continue; fi
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done
          exit "$missing"
